[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-mcp-swarm-http"
version = "1.11.1.post1"
description = "codex-mcp-swarm as one shared, stateless Streamable HTTP MCP service"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    {name = "TKasperczyk"},
]
keywords = ["mcp", "codex", "openai", "async", "parallel", "claude"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["mcp>=2.3,<3", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/TKasperczyk/codex-mcp-swarm"
Repository = "https://github.com/TKasperczyk/codex-mcp-swarm"
Issues = "https://github.com/TKasperczyk/codex-mcp-swarm/issues"

[project.scripts]
codex-mcp-swarm-http = "codex_swarm_http:main"

[tool.setuptools]
py-modules = ["codex_mcp_swarm", "codex_swarm_http"]
